name: Build and Push Docker Image

# 1. DISPARADOR
on:
  push:
    branches:
      - main

# 2. PERMISOS EXPLÍCITOS (¡La clave del éxito!)
permissions:
  contents: read      # Necesario para descargar el código (checkout)
  packages: write     # Necesario para subir la imagen a GHCR

# 3. TRABAJO
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Cambiado a repository_owner para mantener el nombre limpio que usaste manualmente
          tags: |
            ghcr.io/${{ github.repository_owner }}/mi-api-python:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mi-api-python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max